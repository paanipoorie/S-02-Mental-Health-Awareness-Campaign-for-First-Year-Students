                - heading "Why anonymous support is vital." [level=3] [ref=e49]
                - paragraph [ref=e50]: Traditional university counseling resources often have long wait times and high barriers to entry. Peerly bridges the gap by offering immediate, stigma-free access to support.
                - generic [ref=e51]: '"Over 75% of students experiencing mental health struggles do not seek help early due to stigma or fear of academic consequences."'
            - generic [ref=e52]:
                - generic [ref=e53]:
                    - heading "Eliminates Stigma" [level=4] [ref=e54]
                    - paragraph [ref=e55]: Students can discuss sensitive personal issues, academic pressure, and anxiety without worrying about labels, rumors, or disciplinary actions.
                - generic [ref=e56]:
                    - heading "Lowers Help Barriers" [level=4] [ref=e57]
                    - paragraph [ref=e58]: Providing simple, text-based anonymous access encourages first-year students to reach out early, rather than waiting for a severe crisis.
                - generic [ref=e59]:
                    - heading "Increases Openness" [level=4] [ref=e60]
                    - paragraph [ref=e61]: Without the fear of personal identification, students express their true thoughts and concerns, allowing peer mentors to give highly relevant support.
                - generic [ref=e62]:
                    - heading "Builds Solid Trust" [level=4] [ref=e63]
                    - paragraph [ref=e64]: Students retain complete control over their participation. Anonymity establishes an immediate, secure environment of mutual respect.
