            - heading "Security & Trust" [level=2] [ref=e116]
            - heading "Privacy first, by engineering." [level=3] [ref=e117]
            - paragraph [ref=e118]: 'We believe that anonymity is the foundation of genuine peer support. Our platform is designed with mathematical guarantees to protect student identities:'
            - list [ref=e119]:
                - listitem [ref=e120]:
                    - generic [ref=e123]:
                        - strong [ref=e124]: Hash-and-Discard Verification
                        - text: Your university email is only processed to verify active student status. We generate a secure cryptographic hash for rate-limiting, then discard the raw email instantly.
                - listitem [ref=e125]:
                    - generic [ref=e128]:
                        - strong [ref=e129]: Zero PII (Personally Identifiable Information)
                        - text: We do not store your name, student ID number, location, IP address, or browser metadata. Your identity cannot be reverse-engineered.
                - listitem [ref=e130]:
                    - generic [ref=e133]:
                        - strong [ref=e134]: Encrypted Database Logs
                        - text: All message bodies, forum posts, and event registrations are encrypted at rest. Databases cannot associate messages with real-world users.
